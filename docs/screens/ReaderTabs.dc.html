<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background: rgba(255,253,249,0.96); border-top: 1px solid #EFE4D5; padding: 10px 8px 26px; display: flex; justify-content: space-around">
  <sc-for list="{{ items }}" as="i" hint-placeholder-count="5">
    <div onClick="{{ i.select }}" style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; padding: 4px 0">
      <div style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center">{{ i.icon }}</div>
      <div style="font-family: Karla, system-ui, sans-serif; font-size: 10.5px; letter-spacing: 0.04em; color: {{ i.color }}">{{ i.label }}</div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:84},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;stories&quot;,&quot;community&quot;,&quot;ask&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(tab: string) =&gt; void&quot;}}">
const ICONS = {
  home: 'M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5',
  stories: 'M4 4.5h7a2 2 0 0 1 2 2V20a2.2 2.2 0 0 0-2-1.5H4zM20 4.5h-7a2 2 0 0 0-2 2V20a2.2 2.2 0 0 1 2-1.5h7z',
  community: 'M17 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20M10 10.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1.5a4 4 0 0 0-3-3.8M16 3.7a4 4 0 0 1 0 7.6',
  ask: 'M21 11.5a8.4 8.4 0 0 1-9 8.4L3 21l1.1-8.5A8.4 8.4 0 1 1 21 11.5z',
  profile: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8'
};

class Component extends DCLogic {
  renderVals() {
    const active = this.props.tab || 'home';
    const onSelect = this.props.onSelect || (() => {});
    const defs = [
      ['home', 'Home'], ['stories', 'Stories'], ['community', 'Community'],
      ['ask', 'Ask Her'], ['profile', 'Profile']
    ];
    return {
      items: defs.map(([key, label]) => {
        const on = key === active;
        const color = on ? '#C05E3C' : '#9A8877';
        return {
          label, color,
          select: () => onSelect(key),
          icon: React.createElement('svg', {
            width: 21, height: 21, viewBox: '0 0 24 24', fill: 'none',
            stroke: color, strokeWidth: on ? 2 : 1.6, strokeLinecap: 'round', strokeLinejoin: 'round'
          }, React.createElement('path', { d: ICONS[key] }))
        };
      })
    };
  }
}
</script>
</body>
</html>
